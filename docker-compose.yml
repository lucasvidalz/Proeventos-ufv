version: "3.8"

###############################################################################
#  docker-compose.yml – ProEventos (Back-end ASP.NET Core + Front-end SPA)   #
###############################################################################

services:
  ###########################################################################
  # BACK-END – ASP.NET Core 8                                               #
  ###########################################################################
  back:
    build:
      context: Back/src    # ajuste se o diretório for outro
      dockerfile: Dockerfile
    container_name: proeventos-back
    ports:
      - "8080:8080"                    # host:container  (Kestrel usa 8080)
    environment:
      # Força o Kestrel a escutar na porta 8080
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      # Segredos (considere mover p/ .env ou Docker Secrets)
      - TokenKey=super-secret-key
      # SQLite com caminho absoluto dentro do container
      - ConnectionStrings__Default=Data Source=/app/db/ProEventos.db
    volumes:
      # Banco local
      - proeventos-data:/app/db
      # Chaves de criptografia dos cookies (evita logout após restart)
      - proeventos-keys:/var/keys
    networks:
      - proeventos-net

  ###########################################################################
  # FRONT-END – React / Vite / Angular / Vue (build estático)               #
  ###########################################################################
  front:
    build:
      context: ./Front/ProEventos-App                  # ajuste se o diretório for outro
      dockerfile: Dockerfile
    container_name: proeventos-front
    depends_on:
      - back
    ports:
      - "3000:80"                      # host 3000 → container 80 (nginx/http-server)
    environment:
      # Variável consumida pelo código do front para chamar a API
      # Troque o prefixo (REACT_APP_, NG_APP_, VITE_) conforme seu framework
      - VITE_API_BASE=http://back:8080
    networks:
      - proeventos-net

#################################################################
# Rede interna (docker DNS: back, front) e volumes persistentes #
#################################################################
networks:
  proeventos-net:

volumes:
  proeventos-data:
  proeventos-keys:
